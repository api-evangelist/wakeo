- Logistics
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Wakeo spend. Wakeo is an enterprise, customer-provisioned
  supply-chain visibility SaaS with no public rate card. Cost is a negotiated
  subscription / contract, typically driven by tracked shipment volume,
  transport modes (sea, air, road, rail, parcel), and selected platform modules
  (Track and Trace, Analytics, Carbon Footprint, Trusted Routes), with API and
  webhook access included in the commercial agreement. Because pricing is not
  published, per-unit rates are not reconciled here.
notes: >-
  No public pricing exists; obtain the contract structure and any
  volume/overage terms from Wakeo. The dominant cost driver is expected to be
  the number of tracked shipments and enabled modules rather than raw API call
  counts.
sources:
- https://wakeo.co/
- https://wakeo.co/platform/overview/
- https://docs.wakeo.co/docs/getting-started
