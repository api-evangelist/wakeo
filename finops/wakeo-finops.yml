alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Wakeo
serviceCategory: Supply Chain Visibility
billingModel:
  pricingCategory: Subscription
  billingFrequency: Annual
  billingCurrency: EUR
  chargeCategories:
  - Purchase
  - Usage
focusColumns:
  ServiceName: Wakeo Visibility Platform
  ServiceCategory: Supply Chain Visibility
  ProviderName: Wakeo
  PublisherName: Wakeo
  InvoiceIssuerName: Wakeo
  BillingCurrency: EUR
  ChargeCategory: Purchase
  PricingCategory: Subscription
meters:
- name: tracked_shipments
  description: Number of shipments / transport orders tracked, the expected primary cost driver.
  unit: shipments
  aggregation: sum
  dimensions:
  - account
  - mode
- name: platform_modules
  description: Enabled platform modules (Track and Trace, Analytics, Carbon Footprint, Trusted Routes).
  unit: modules
  aggregation: max
  dimensions:
  - account
- name: api_access
  description: API and webhook access, included in the enterprise agreement rather than metered separately.
  unit: subscription
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Track shipment volume by transport mode and module against the contracted allowance.
- name: Allocation
  description: Map tracked shipments and API usage to internal business units or trade lanes.
- name: Optimization
  description: Enable only the modes and modules in active use; scope tracking to shipments that need predictive visibility.
- name: Accountability
  description: Assign an owner for the Wakeo contract and review shipment volume against contracted terms each renewal.
