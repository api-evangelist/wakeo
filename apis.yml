aid: wakeo
url: https://raw.githubusercontent.com/api-evangelist/wakeo/refs/heads/main/apis.yml
name: Wakeo
kind: company
description: >-
  Wakeo is a Paris-based SaaS platform for real-time multimodal supply-chain
  visibility across sea, air, road, rail, and parcel. It combines carrier,
  telematics, and AIS tracking data with data-science predictions to deliver
  predictive door-to-door ETAs, milestone events, congestion and disruption
  alerts, carbon-footprint reporting, and route reliability scoring. Wakeo's
  REST API and webhooks let customers pull transport orders and push enriched
  ETAs and tracking updates into a TMS, ERP, or MRP. The API is enterprise and
  customer-provisioned - the reference at docs.wakeo.co is behind a password
  wall and access is granted by Wakeo Customer Success or support@wakeo.co.
